<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>售后退款 · 邻里鲜团购后台</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="gb.css">
<style>
  .photos { display: flex; gap: 8px; }
  .photos .art { width: 96px; height: 96px; border-radius: 8px; position: relative; }
  .photos .art::after { content: "买家上传"; position: absolute; left: 6px; bottom: 6px; font-size: 12px; color: #fff; background: rgba(0, 0, 0, .45); padding: 0 6px; border-radius: 4px; line-height: 20px; }
  .resp { display: flex; gap: 8px; flex-wrap: wrap; }
  .quote { padding: 12px 14px; border-radius: var(--r-card); background: var(--c-bg-page); color: var(--c-text); line-height: 1.7; }
  .od-sec { margin-bottom: 22px; }
  .od-sec h3 { font-size: var(--fs-base); margin-bottom: 10px; }
  textarea.input { height: 76px; padding: 8px 10px; resize: vertical; }
</style>
</head>
<body>
<script src="../icons.js"></script>
<script src="../data.js"></script>
<script>window.__PAGE__ = { key: '/gb/aftersale', title: '售后退款' };</script>

<div id="page-body">
  <div class="page-head">
    <div><h1>售后退款</h1><p>居民在小程序申请，24 小时内要处理完；超时没处理的自动同意退款。</p></div>
  </div>
  <section class="card">
    <div class="toolbar"><div class="seg" data-seg="st"><button class="on" data-v="wait">待审核 <span class="n hot">2</span></button><button data-v="done">已退款 <span class="n">3</span></button><button data-v="rej">已驳回 <span class="n">1</span></button><button data-v="">全部 <span class="n">6</span></button></div>
      <span class="grow"></span><span style="font-size:var(--fs-xs);color:var(--c-text-3)">责任方决定这笔钱由谁承担，月底和供应商、团长对账用</span></div>
    <div class="tbl-wrap"><table class="tbl" id="tbl"></table></div>
  </section>
  <p class="foot-note">本原型所有数字均为示例数据。</p>
</div>

<script src="shell.js"></script>
<script>
  const { ORDERS, yuan, art, esc } = GB;
  const R = [
    { id: 'SH1117002', o: 25111601410, gid: 1007, n: 1, type: '质量问题', reason: '鲈鱼不新鲜，有异味，打开就闻到了', amount: 22.8, apply: '11/17 17:05', left: '剩 23 小时', st: 'wait', photos: 2 },
    { id: 'SH1117001', o: 25111601655, gid: 1008, n: 1, type: '少件', reason: '五花肉只收到 1 盒，订单是 2 盒', amount: 25.9, apply: '11/17 16:42', left: '剩 22 小时', st: 'wait', photos: 0, note: '分拣记录：幸福里少 1 盒已登记（团长签收时）' },
    { id: 'SH1116014', o: 25111601702, gid: 1011, n: 1, type: '质量问题', reason: '香蕉有两根压烂了', amount: 8.8, apply: '11/16 19:30', st: 'done', who: '供应商', photos: 1 },
    { id: 'SH1116011', o: 25111501208, gid: 1009, n: 1, type: '未取货', reason: '出差没来得及取', amount: 49.9, apply: '11/16 10:12', st: 'rej', who: '—', photos: 0, rej: '团长已帮忙保管至 11/18，建议回来后自提' },
    { id: 'SH1115020', o: 25111601880, gid: 1002, n: 1, type: '破损', reason: '鸡蛋碎了 3 个', amount: 2.7, apply: '11/15 20:41', st: 'done', who: '平台', photos: 1 },
    { id: 'SH1115018', o: 25111601925, gid: 1001, n: 1, type: '质量问题', reason: '草莓底下几颗发软', amount: 10, apply: '11/15 18:02', st: 'done', who: '供应商', photos: 2 },
  ];
  const ST = { wait: ['待审核', 'warn'], done: ['已退款', 'ok'], rej: ['已驳回', ''] };
  let st = 'wait';
  function draw() {
    const rows = R.filter((r) => !st || r.st === st);
    document.getElementById('tbl').innerHTML = `<thead><tr><th>售后单</th><th>商品</th><th>原因</th><th class="num-r">退款金额</th><th>提货点</th><th>${st === 'wait' ? '处理时限' : '责任方'}</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map((r) => {
      const o = ORDERS.find((x) => x.no === r.o), g = GB.goods(r.gid), L = GB.leader(o.leader);
      return `<tr data-id="${r.id}"><td><div class="cell-2"><b class="num">${r.id}</b><span class="sub">${r.apply} 申请 · ${esc(o.buyer)}</span></div></td>
        <td><div class="goods-cell">${art(g.art, 36)}<div style="min-width:0"><div class="nm">${esc(g.name)} × ${r.n}</div><div class="sub num">订单 ${r.o}</div></div></div></td>
        <td><div class="cell-2"><span><span class="tag ${r.type === '质量问题' ? 'bad' : ''}">${r.type}</span>${r.photos ? ` <span style="color:var(--c-text-3);font-size:var(--fs-xs)">${r.photos} 张图</span>` : ''}</span><span class="sub ellipsis" style="max-width:220px">${esc(r.reason)}</span></div></td>
        <td class="num-r"><b>${yuan(r.amount)}</b></td><td>${esc(L.point)}</td>
        <td>${r.st === 'wait' ? `<span class="mk-cutoff">${ico('timer')}<b>${r.left}</b></span>` : r.who}</td>
        <td><span class="tag ${ST[r.st][1]}">${ST[r.st][0]}</span></td>
        <td><div class="acts">${r.st === 'wait' ? '<button class="link" data-audit>审核</button>' : '<button class="link muted" data-audit>查看</button>'}</div></td></tr>`;
    }).join('') || `<tr><td colspan="8"><div class="empty">${ico('check-circle')}<b>没有待审核的售后</b><span>新的申请会在侧栏「售后退款」显示数字</span></div></td></tr>`}</tbody>`;
  }
  draw();
  bindSeg(document, (k, v) => { st = v; draw(); });
  document.getElementById('tbl').addEventListener('click', (e) => {
    if (!e.target.closest('[data-audit]')) return;
    const r = R.find((x) => x.id === e.target.closest('tr').dataset.id), o = ORDERS.find((x) => x.no === r.o), g = GB.goods(r.gid), L = GB.leader(o.leader);
    const d = openDrawer(`售后 ${r.id}`, `
      <div class="od-sec"><h3>买家说</h3><div class="quote"><span class="tag ${r.type === '质量问题' ? 'bad' : ''}">${r.type}</span>　${esc(r.reason)}</div>
        ${r.photos ? `<div class="photos" style="margin-top:10px">${Array.from({ length: r.photos }, () => art(g.art, 96)).join('')}</div>` : ''}
        ${r.note ? `<p style="margin-top:10px;font-size:var(--fs-sm);color:var(--c-text-2)">${ico('info', 'ico-sm')} ${r.note}</p>` : ''}</div>
      <div class="od-sec"><h3>订单</h3><dl class="dl"><dt>商品</dt><dd>${esc(g.name)} × ${r.n} · ${yuan(g.price)}/件</dd><dt>订单号</dt><dd class="num">${r.o}</dd><dt>买家</dt><dd>${esc(o.buyer)} · <span class="num">${o.phone}</span></dd><dt>提货点</dt><dd>${esc(L.point)} · 团长 ${esc(L.leader)}</dd><dt>本单实付</dt><dd>${yuan(o.pay)}${o.discount ? `（用了${esc(o.coupon)}）` : ''}</dd></dl></div>
      ${r.st === 'wait' ? `<div class="od-sec"><h3>处理</h3>
        <div class="field" style="margin-bottom:14px"><label>退款金额</label><div class="input-unit" style="width:160px"><input class="input num" value="${r.amount}"><span>元</span></div><span class="hint">最多退 ${yuan(g.price * r.n)}；用了优惠券的按比例扣减</span></div>
        <div class="field" style="margin-bottom:14px"><label>责任方</label><div class="radio-cards" id="who">${['供应商', '团长', '平台', '物流'].map((w, i) => `<span class="radio-card${(r.type === '少件' ? 1 : 0) === i ? ' on' : ''}">${w}</span>`).join('')}</div><span class="hint">${r.type === '少件' ? '分拣记录显示团长签收时已登记短少，建议记在平台分拣' : '生鲜质量问题一般由供应商承担'}</span></div>
        <div class="field"><label>回复买家（会显示在小程序）</label><textarea class="input">${r.type === '少件' ? '抱歉少给了您 1 盒，已全额退款，钱会原路退回微信。' : '抱歉给您带来不好的体验，已全额退款，钱会原路退回微信。'}</textarea></div></div>`
        : `<div class="od-sec"><h3>处理结果</h3><dl class="dl"><dt>结果</dt><dd>${ST[r.st][0]}</dd>${r.st === 'done' ? `<dt>退款</dt><dd>${yuan(r.amount)} · 原路退回</dd><dt>责任方</dt><dd>${r.who}</dd>` : `<dt>驳回理由</dt><dd>${esc(r.rej)}</dd>`}</dl></div>`}`,
      r.st === 'wait' ? `<button class="btn danger" id="rej">驳回</button><button class="btn primary" id="ok">同意退款</button>` : `<button class="btn" data-close-drawer>关闭</button>`, 560);
    d.querySelector('#who')?.addEventListener('click', (e) => { const c = e.target.closest('.radio-card'); if (c) d.querySelectorAll('#who .radio-card').forEach((x) => x.classList.toggle('on', x === c)); });
    d.querySelector('#ok')?.addEventListener('click', () => { r.st = 'done'; r.who = d.querySelector('#who .on').textContent; closeDrawer(); draw(); toast('已退款，钱会在 1–3 天内原路回到买家微信'); });
    d.querySelector('#rej')?.addEventListener('click', () => toast('驳回必须写清理由，买家可以再次申请（原型）'));
  });
</script>
</body>
</html>
