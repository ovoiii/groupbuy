<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>核销提货 · 邻里鲜小程序</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="mp.css">
<style>
  .cam { margin: 12px; height: 230px; border-radius: 14px; background: #1A221D; position: relative; overflow: hidden; display: grid; place-items: center; color: rgba(255, 255, 255, .8); font-size: 14px; }
  .cam .fr { position: absolute; width: 170px; height: 170px; top: 22px; left: 50%; margin-left: -85px; }
  .cam .fr i { position: absolute; width: 26px; height: 26px; border: 3px solid var(--c-mark-bright); }
  .cam .fr i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
  .cam .fr i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
  .cam .fr i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
  .cam .fr i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }
  .cam .line { position: absolute; left: 12px; right: 12px; height: 2px; background: var(--c-mark-bright); top: 50%; box-shadow: 0 0 12px var(--c-mark-bright); animation: sc 2s ease-in-out infinite alternate; }
  @keyframes sc { from { top: 10%; } to { top: 90%; } }
  @media (prefers-reduced-motion: reduce) { .cam .line { animation: none; } }
  .cam p { position: absolute; bottom: 12px; }
  .code-in { display: flex; gap: 8px; justify-content: center; padding: 14px; }
  .code-in input { width: 44px; height: 52px; border-radius: 10px; border: 1px solid var(--c-border); text-align: center; font: 700 22px var(--font-num); outline: none; background: var(--c-surface); }
  .code-in input:focus { border-color: var(--c-primary); box-shadow: 0 0 0 3px var(--c-primary-soft-2); }
  .who { display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid var(--c-border-subtle); }
  .who .tail { width: 56px; height: 48px; border-radius: 10px; background: var(--c-primary-soft); color: var(--c-primary-active); display: grid; place-items: center; font: 700 18px var(--font-num); }
  .who b { font-size: 17px; display: block; }
  .who span { font-size: 13px; color: var(--c-text-2); }
  .it { display: grid; grid-template-columns: 22px 52px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; }
  .it .art { border-radius: 8px; }
  .it b { font-size: 15px; display: block; }
  .it span { font-size: 12px; color: var(--c-text-3); }
  .it .n { font: 700 20px var(--font-num); }
  .done { text-align: center; padding: 40px 20px; }
  .done .ic { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 50%; background: var(--c-primary); color: #fff; display: grid; place-items: center; }
  .done .ic .ico { width: 38px; height: 38px; stroke-width: 2.6; }
  .done h2 { font-size: 20px; }
  .done p { color: var(--c-text-2); margin: 6px 0 24px; }
</style>
</head>
<body>
<script src="../icons.js"></script>
<script src="../data.js"></script>
<div class="app" data-title="核销提货" data-back="leader.html">
  <main class="page" id="pg"></main>
  <div class="actbar" id="bar" hidden></div>
</div>
<script src="mp.js"></script>
<script>
  const { art, esc } = GB;
  const q = new URLSearchParams(location.search);
  const items = [[1002, 1], [1004, 2]];
  const got = new Set();
  function scanView() {
    document.getElementById('bar').hidden = true;
    document.getElementById('pg').innerHTML = `
      <div class="cam" id="cam"><div class="fr"><i></i><i></i><i></i><i></i></div><div class="line"></div><p>把顾客的提货码放进框里（点这里模拟扫到）</p></div>
      <div class="mcard"><div class="mcard-hd"><h2>或者输入 6 位提货码</h2></div><div class="code-in" id="ci">${'<input inputmode="numeric" maxlength="1" aria-label="提货码">'.repeat(6)}</div>
        <p class="muted" style="font-size:12px;padding:0 14px 14px;text-align:center">顾客没带手机：在工作台按手机尾号找订单</p></div>`;
    document.getElementById('cam').onclick = () => orderView();
    const ins = [...document.querySelectorAll('#ci input')];
    ins.forEach((inp, i) => inp.addEventListener('input', () => { if (inp.value && ins[i + 1]) ins[i + 1].focus(); if (ins.every((x) => x.value)) orderView(); }));
    if (q.get('manual')) ins[0].focus();
  }
  function orderView() {
    document.getElementById('pg').innerHTML = `
      <div class="mcard" style="margin-top:12px"><div class="who"><span class="tail">1029</span><div><b>张女士</b><span>提货码 472915 · 11月16日团</span></div><span class="tag ok" style="margin-left:auto">已付款</span></div>
        <div class="mcard-hd" style="padding-top:12px"><h2>逐件点货</h2><span class="more">点一下表示已拿给顾客</span></div>
        ${items.map(([id, n]) => { const g = GB.goods(id); return `<div class="it" data-id="${id}"><button class="ck${got.has(id) ? ' on' : ''}" aria-label="已拿">${ico('check')}</button>${art(g.art, 52, 8)}<div style="min-width:0"><b>${esc(g.name)}</b><span>${esc(g.spec)}${['乳品烘焙'].includes(g.cat) ? ' · 冰柜里' : ''}</span></div><span class="n">× ${n}</span></div>`; }).join('')}
        <div style="height:8px"></div></div>
      <div class="demo-tip">少了或坏了：先别核销，让顾客在小程序申请售后<br>示例数据</div>`;
    const bar = document.getElementById('bar'); bar.hidden = false;
    const all = got.size === items.length;
    bar.innerHTML = `<div class="sum">已点 <b class="num">${got.size}</b> / ${items.length} 种<small>${all ? '核对无误可以交货' : '全部点完才能确认'}</small></div><button class="mbtn pri" id="ok" ${all ? '' : 'disabled'} style="width:150px">确认交货</button>`;
    document.getElementById('pg').onclick = (e) => { const r = e.target.closest('.it'); if (!r) return; const id = +r.dataset.id; got.has(id) ? got.delete(id) : got.add(id); orderView(); };
    document.getElementById('ok').onclick = () => {
      bar.hidden = true;
      document.getElementById('pg').onclick = null;
      document.getElementById('pg').innerHTML = `<div class="done"><div class="ic">${ico('check')}</div><h2>交货完成</h2><p>张女士 · 3 件<br>顾客会收到「已提货」通知</p><a class="mbtn pri block" href="verify.html">继续核销下一单</a><a class="mbtn line block" style="margin-top:10px" href="leader.html">回工作台</a></div>`;
    };
  }
  q.get('code') ? orderView() : scanView();
</script>
</body>
</html>
