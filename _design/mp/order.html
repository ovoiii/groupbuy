<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>提货码 · 邻里鲜小程序</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="mp.css">
<style>
  .app { --bar-bg: var(--c-primary); --bar-fg: #fff; }
  .top { background: var(--c-primary); color: #fff; padding: 4px 16px 64px; }
  .top h2 { font-size: 20px; }
  .top p { font-size: 13px; opacity: .85; margin-top: 4px; }
  .code { margin: -52px 12px 12px; padding: 20px 16px 18px; border-radius: 14px; background: var(--c-surface); text-align: center; box-shadow: 0 6px 20px rgba(19, 34, 26, .08); }
  .code .qr { width: 168px; height: 168px; margin: 4px auto 12px; display: block; }
  .code .num { font: 700 32px/1 var(--font-num); letter-spacing: .22em; color: var(--c-text); padding-left: .22em; }
  .code .hint { font-size: 13px; color: var(--c-text-3); margin-top: 10px; }
  .code .bright { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; font-size: 13px; color: var(--c-text-2); }
  .addr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 14px; }
  .addr b { display: block; font-size: 16px; }
  .addr span { font-size: 13px; color: var(--c-text-2); }
  .circle { width: 44px; height: 44px; border-radius: 50%; background: var(--c-primary-soft); color: var(--c-primary); display: grid; place-items: center; border: 0; }
  .circle + small { display: block; }
  .it { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; }
  .it .art { border-radius: 8px; }
  .it .nm { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .sp { font-size: 12px; color: var(--c-text-3); }
  .it .r { text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; }
  .it .r small { display: block; color: var(--c-text-3); font-size: 12px; }
  .foot { display: flex; gap: 10px; justify-content: flex-end; padding: 4px 12px 24px; }
</style>
</head>
<body>
<script src="../icons.js"></script>
<script src="../data.js"></script>
<div class="app" data-title="提货码" data-back="orders.html">
  <main class="page" id="pg"></main>
</div>
<script src="mp.js"></script>
<script>
  const { art, esc, yuan } = GB;
  const L = GB.leader(1);
  const items = [[1002, 1], [1004, 2]];
  // 二维码示意：固定伪随机方块
  let seed = 7, qr = '';
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
    const finder = (a, b) => x >= a && x < a + 7 && y >= b && y < b + 7;
    if (finder(0, 0) || finder(18, 0) || finder(0, 18)) continue;
    if (rnd() > 0.52) qr += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  const fp = (a, b) => `<rect x="${a}" y="${b}" width="7" height="7"/><rect x="${a + 1}" y="${b + 1}" width="5" height="5" fill="#fff"/><rect x="${a + 2}" y="${b + 2}" width="3" height="3"/>`;
  document.getElementById('pg').innerHTML = `
    <div class="top"><h2>已到货，可以来取了</h2><p>11月16日团 · 订单 25111601930</p></div>
    <div class="code"><svg class="qr" viewBox="0 0 25 25" shape-rendering="crispEdges" fill="#1D231F" role="img" aria-label="提货二维码">${fp(0, 0)}${fp(18, 0)}${fp(0, 18)}${qr}</svg>
      <div class="num">472915</div><div class="hint">给团长扫码，或报这 6 位数字</div>
      <div style="margin-top:12px">${GB.pickup('').replace('明天 16:00', '今天 16:00')}</div></div>
    <div class="mcard"><div class="addr"><div style="min-width:0"><b>${esc(L.point)}</b><span>${esc(L.addr)} · 08:00–21:00</span></div>
      <button class="circle" aria-label="导航" onclick="mtoast('打开微信地图导航')">${ico('compass')}</button><button class="circle" aria-label="联系团长" onclick="mtoast('呼叫团长 ${L.leader}')">${ico('phone')}</button></div></div>
    <div class="mcard"><div class="mcard-hd"><h2>商品</h2><span class="more">共 3 件</span></div>
      ${items.map(([id, n]) => { const g = GB.goods(id); return `<div class="it">${art(g.art, 56, 8)}<div style="min-width:0"><div class="nm">${esc(g.name)}</div><div class="sp">${esc(g.spec)}</div></div><div class="r">${yuan(g.price * n)}<small>× ${n}</small></div></div>`; }).join('')}
      <div class="row-line"><span class="k">实付</span><span class="v"><b class="num">${yuan(52.6)}</b></span></div></div>
    <div class="foot"><a class="mbtn sm line" href="aftersale.html">申请售后</a></div>
    <div class="demo-tip">提货后 24 小时内发现问题都可以申请售后<br>示例数据</div>`;
</script>
</body>
</html>
